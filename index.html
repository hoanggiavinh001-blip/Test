<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doAI 4.1 Pro - Hoàn chỉnh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="bg-[#080808] text-gray-200 h-screen font-sans">

    <div id="view-auth" class="h-screen flex items-center justify-center bg-black text-white p-6">
        <div class="w-full max-w-md bg-white/5 border border-white/10 p-10 rounded-[3rem] text-center backdrop-blur-xl">
            <div class="w-20 h-20 bg-indigo-600 rounded-[2rem] mx-auto mb-6 flex items-center justify-center">
                <i data-lucide="zap" class="w-10 h-10"></i>
            </div>
            <h1 class="text-4xl font-black mb-2 italic">doAI 4.1</h1>
            <button onclick="handleAuth()" class="w-full py-5 bg-indigo-600 rounded-2xl font-bold hover:bg-indigo-700 transition-all">Truy cập hệ thống</button>
        </div>
    </div>

    <div id="app-wrapper" class="flex h-screen hidden">
        <aside id="sidebar" class="w-72 bg-[#0f0f11] border-r border-white/5 flex flex-col p-6">
            <div class="flex items-center gap-3 mb-10"><i data-lucide="zap" class="text-indigo-500"></i><span class="text-2xl font-black italic">doAI 4.1</span></div>
            <button onclick="createNewChat()" class="w-full py-4 bg-indigo-600 rounded-2xl font-bold mb-8 flex items-center justify-center gap-2">
                <i data-lucide="plus"></i> Chat mới
            </button>
            <div id="chat-history" class="flex-1 overflow-y-auto space-y-2 custom-scrollbar"></div>
        </aside>

        <main class="flex-1 flex flex-col relative">
            <header class="h-16 flex items-center justify-between px-6 border-b border-white/5">
                <div id="intelligence-badge" class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-blue-500/20 text-blue-400">FREE INTELLIGENCE ACTIVE</div>
            </header>

            <div id="view-chat" class="flex-1 flex flex-col min-h-0">
                <div class="flex-1 overflow-y-auto p-6 space-y-8">
                    <div id="messages-container" class="max-w-3xl mx-auto space-y-8"></div>
                </div>
                <div class="p-6">
                    <div class="max-w-3xl mx-auto p-3 border border-white/10 rounded-[2.5rem] flex items-center bg-[#121214]">
                        <input id="chat-input" type="text" placeholder="Đặt câu hỏi..." class="flex-1 bg-transparent border-none outline-none px-4 text-sm text-white" onkeydown="if(event.key === 'Enter') handleSend()"/>
                        <button id="btn-send" onclick="handleSend()" class="p-4 bg-indigo-600 rounded-[1.5rem] hover:bg-indigo-700 transition-all"><i data-lucide="send"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // CẤU HÌNH: ĐIỀN API KEY CỦA BẠN VÀO ĐÂY
        const apiKey = "DIEN_API_KEY_CUA_BAN_VAO_DAY";
        
        let activeChatId = null;
        let messagesMap = {};

        function handleAuth() {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('app-wrapper').classList.remove('hidden');
            createNewChat();
            lucide.createIcons();
        }

        function createNewChat() {
            activeChatId = Date.now();
            messagesMap[activeChatId] = [{ role: 'bot', content: "Chào bạn, tôi là doAI 4.1. Tôi có thể giúp gì cho bạn?", type: 'text' }];
            renderMessages();
        }

        async function handleSend() {
            const inputEl = document.getElementById('chat-input');
            const query = inputEl.value.trim();
            if (!query) return;

            inputEl.value = '';
            messagesMap[activeChatId].push({ role: 'user', content: query });
            renderMessages();

            try {
                // Sử dụng URL chính thức của Google Gemini
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: query }] }] })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    messagesMap[activeChatId].push({ role: 'bot', content: data.candidates[0].content.parts[0].text, type: 'text' });
                } else {
                    throw new Error(data.error?.message || "Lỗi phản hồi API");
                }
            } catch (err) {
                messagesMap[activeChatId].push({ role: 'bot', content: "Lỗi kết nối: " + err.message + ". Hãy kiểm tra lại API Key.", type: 'text' });
            }
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            messagesMap[activeChatId].forEach(m => {
                const div = document.createElement('div');
                div.className = `flex gap-4 ${m.role === 'user' ? 'flex-row-reverse' : ''}`;
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center ${m.role === 'bot' ? 'bg-indigo-600' : 'bg-gray-700'}">
                        <i data-lucide="${m.role === 'bot' ? 'zap' : 'user'}" class="w-5 h-5 text-white"></i>
                    </div>
                    <div class="p-5 rounded-[2rem] max-w-[80%] ${m.role === 'user' ? 'bg-indigo-600' : 'bg-[#18181b]'}">
                        ${m.content}
                    </div>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }
    </script>
</body>
</html>
