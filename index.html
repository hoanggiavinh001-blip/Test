<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoAI - Trí tuệ nhân tạo toàn năng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', sans-serif] },
                    colors: { 'doai-blue': '#3b82f6' }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .typing-dot { animation: blink 1.4s infinite both; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }
        /* Language dropdown logic */
        .lang-menu:focus-within .lang-dropdown { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 h-screen flex overflow-hidden transition-colors duration-300">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:relative w-64 h-full bg-slate-100 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between transition-all duration-300 z-30 -translate-x-full md:translate-x-0">
        <div>
            <div class="p-4 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/20">D</div>
                    <span id="app-title" class="font-bold text-xl tracking-tight text-slate-950 dark:text-white">DoAI</span>
                </div>
                <button onclick="toggleSidebar()" class="text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white md:hidden">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="px-4 mb-6">
                <button onclick="startNewChat()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl flex items-center justify-center space-x-2 shadow-md shadow-blue-600/20 transition-all active:scale-[0.98]">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span data-lang="newChat">Đoạn chat mới</span>
                </button>
            </div>

            <nav class="px-3 space-y-1 overflow-y-auto max-h-[calc(100vh-280px)]">
                <div data-lang="recent" class="text-xs font-semibold text-slate-500 dark:text-slate-400 px-3 py-2 uppercase tracking-wider">Gần đây</div>
                <div id="history-list" class="space-y-1">
                    <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-sm transition-colors group truncate">
                        <i class="fa-regular fa-message text-slate-400 group-hover:text-blue-500 dark:text-slate-500 text-sm"></i>
                        <span class="truncate text-slate-700 dark:text-slate-200 group-hover:text-slate-950 dark:group-hover:text-white">Ý tưởng content marketing</span>
                    </a>
                </div>
            </nav>
        </div>

        <div class="p-4 border-t border-slate-200 dark:border-slate-800 space-y-3 bg-slate-100/50 dark:bg-slate-900/50">
            <!-- Language Selector -->
            <div class="relative lang-menu">
                <button class="w-full flex items-center justify-between space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-sm transition-colors text-slate-700 dark:text-slate-200">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-globe text-slate-500 dark:text-slate-400"></i>
                        <span id="current-lang-name">Tiếng Việt</span>
                    </div>
                    <i class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
                </button>
                <div class="lang-dropdown absolute bottom-full left-0 w-full mb-2 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 py-2 hidden z-50">
                    <button onclick="changeLanguage('vi')" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-between">Tiếng Việt <i id="check-vi" class="fa-solid fa-check text-blue-500 text-xs hidden"></i></button>
                    <button onclick="changeLanguage('en')" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-between">English <i id="check-en" class="fa-solid fa-check text-blue-500 text-xs hidden"></i></button>
                    <button onclick="changeLanguage('ja')" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-between">日本語 <i id="check-ja" class="fa-solid fa-check text-blue-500 text-xs hidden"></i></button>
                </div>
            </div>

            <button onclick="toggleDarkMode()" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-sm transition-colors text-slate-700 dark:text-slate-200">
                <i class="fa-solid fa-moon dark:fa-sun text-slate-500 dark:text-slate-400"></i>
                <span data-lang="darkMode" class="dark:hidden">Chế độ tối</span>
                <span data-lang="lightMode" class="hidden dark:inline">Chế độ sáng</span>
            </button>
            
            <div class="flex items-center space-x-3 px-3 py-2 mt-2 border-t dark:border-slate-700 pt-3">
                <img src="https://api.dicebear.com/8.x/notionists/svg?seed=bin" alt="Avatar" class="w-9 h-9 rounded-full bg-slate-200 ring-2 ring-white dark:ring-slate-700">
                <div>
                    <div class="text-sm font-semibold text-slate-950 dark:text-white">Bin</div>
                    <div data-lang="status" class="text-xs text-emerald-600 dark:text-emerald-400 font-medium">Tài khoản cao cấp</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full bg-white dark:bg-slate-950 transition-colors duration-300">
        
        <!-- Header -->
        <header class="sticky top-0 z-20 h-16 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 bg-white/90 dark:bg-slate-950/90 backdrop-blur-sm transition-colors duration-300">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white md:hidden">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <h2 class="text-lg font-bold text-slate-950 dark:text-white">
                    Do<span class="text-blue-600">AI</span> <span data-lang="headerTitle" class="font-medium text-slate-600 dark:text-slate-400 text-base">Toàn năng</span>
                </h2>
            </div>
            <div class="flex items-center gap-2">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span data-lang="online" class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Đang hoạt động</span>
            </div>
        </header>

        <!-- Chat Body -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 scroll-smooth">
            
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center max-w-3xl mx-auto transition-opacity duration-500">
                <div class="w-20 h-20 rounded-3xl bg-blue-600 flex items-center justify-center text-white text-5xl font-bold shadow-xl shadow-blue-500/20 mb-8">D</div>
                <h1 data-lang="welcomeTitle" class="text-4xl md:text-5xl font-extrabold text-slate-950 dark:text-white tracking-tighter mb-4">
                    Xin chào, tôi là <span class="text-blue-600">DoAI</span>
                </h1>
                <p data-lang="welcomeSubtitle" class="text-lg text-slate-600 dark:text-slate-400 max-w-xl mb-12">
                    Trợ lý AI thông minh của bạn. Hãy đặt câu hỏi, yêu cầu viết mã, hoặc tạo hình ảnh sáng tạo.
                </p>

                <!-- Suggestions -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full text-left">
                    <button onclick="quickPrompt(this)" data-prompt="Viết một bài thơ ngắn về mùa thu bằng tiếng Việt" class="p-5 bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-2xl transition-all group">
                        <div class="font-semibold text-slate-950 dark:text-white mb-1 flex items-center justify-between">
                            <span data-lang="sug1Title">Viết sáng tạo</span>
                            <i class="fa-solid fa-feather-pointed text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </div>
                        <div data-lang="sug1Desc" class="text-sm text-slate-600 dark:text-slate-400">Làm thơ, viết email, sáng tạo nội dung...</div>
                    </button>
                    <button onclick="quickPrompt(this)" data-prompt="Tạo ảnh một chú mèo robot dễ thương phong cách Pixar, 4k" class="p-5 bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-2xl transition-all group">
                        <div class="font-semibold text-slate-950 dark:text-white mb-1 flex items-center justify-between">
                            <span data-lang="sug2Title">Tạo hình ảnh</span>
                            <i class="fa-solid fa-image text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </div>
                        <div data-lang="sug2Desc" class="text-sm text-slate-600 dark:text-slate-400">Biến ý tưởng thành hình ảnh nghệ thuật</div>
                    </button>
                    <button onclick="quickPrompt(this)" data-prompt="Tạo một nút bấm (button) đẹp mắt bằng HTML và CSS với hiệu ứng hover" class="p-5 bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-2xl transition-all group">
                        <div class="font-semibold text-slate-950 dark:text-white mb-1 flex items-center justify-between">
                            <span data-lang="sug3Title">Lập trình</span>
                            <i class="fa-solid fa-code text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </div>
                        <div data-lang="sug3Desc" class="text-sm text-slate-600 dark:text-slate-400">Viết, sửa lỗi và giải thích code</div>
                    </button>
                    <button onclick="quickPrompt(this)" data-prompt="Giải phương trình bậc hai: 2x^2 - 4x - 6 = 0 chi tiết từng bước" class="p-5 bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-2xl transition-all group">
                        <div class="font-semibold text-slate-950 dark:text-white mb-1 flex items-center justify-between">
                            <span data-lang="sug4Title">Toán học & Logic</span>
                            <i class="fa-solid fa-calculator text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </div>
                        <div data-lang="sug4Desc" class="text-sm text-slate-600 dark:text-slate-400">Giải các bài toán phức tạp</div>
                    </button>
                </div>
            </div>

            <!-- Chat History (Dynamic) -->
            <div id="chat-results" class="space-y-10 max-w-3xl mx-auto hidden"></div>
        </div>

        <!-- Input Area -->
        <footer class="p-4 md:p-6 bg-white dark:bg-slate-950 border-t border-slate-100 dark:border-slate-8
